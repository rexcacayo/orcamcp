[project]
name = "orcamcp"
version = "1.1.0"
description = "MCP server to slice with your own OrcaSlicer and your user presets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ricardo Lugaresi" }]
dependencies = ["mcp>=1.10,<2"]

[project.urls]
Repository = "https://github.com/rexcacayo/orcamcp"

[project.scripts]
orcamcp = "orca_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/orca_mcp.py"]
sources = ["src"]
